    <!-- ThemeScript to prevent Flash of Wrong Theme (FOUC) -->
    <script>
      (function() {
        try {
          var validThemes = ['dark', 'light', 'warm', 'slate'];
          var stored = localStorage.getItem('air-studio-theme') || localStorage.getItem('projectair-theme');
          var theme = stored;
          if (!theme || validThemes.indexOf(theme) === -1) {
            var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            theme = prefersLight ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
